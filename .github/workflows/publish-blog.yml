name: Publish an article

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Paste a Blog Issue URL or a Note comment permalink
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blog-mutations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve and save the publication snapshot
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: node scripts/publish-blog.mjs

      - name: Synchronize public assets
        if: steps.snapshot.outputs.needs_deployment == 'true'
        run: node scripts/sync-blog-assets.mjs

      - name: Set up pnpm
        if: steps.snapshot.outputs.needs_deployment == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false

      - name: Install blog dependencies
        if: steps.snapshot.outputs.needs_deployment == 'true'
        run: pnpm --dir blog install --frozen-lockfile --ignore-scripts

      - name: Check the selected theme
        if: steps.snapshot.outputs.needs_deployment == 'true'
        run: pnpm --dir blog exec astro check

      - name: Prepare the Pages site
        if: steps.snapshot.outputs.needs_deployment == 'true'
        run: pnpm --dir blog run build

      - name: Save the validated snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          BLOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .blog/content/posts .blog/receipts
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish article snapshot'
            git push origin "HEAD:${BLOG_DEFAULT_BRANCH}"
          fi

      - name: Upload the Pages artifact
        if: steps.snapshot.outputs.needs_deployment == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/dist

      - name: Publish the site
        if: steps.snapshot.outputs.needs_deployment == 'true'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Record the successful deployment
        if: steps.snapshot.outputs.needs_deployment == 'true'
        env:
          ARTICLE_URL: ${{ steps.snapshot.outputs.article_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          SNAPSHOT_SHA256: ${{ steps.snapshot.outputs.snapshot_sha256 }}
          SOURCE_ID: ${{ steps.snapshot.outputs.source_id }}
          SOURCE_KIND: ${{ steps.snapshot.outputs.source_kind }}
        run: node scripts/record-deployment.mjs

      - name: Save deployment status
        if: steps.snapshot.outputs.needs_deployment == 'true'
        env:
          BLOG_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .template/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record deployed snapshot'
            git push origin "HEAD:${BLOG_DEFAULT_BRANCH}"
          fi

      - name: Confirm the published article
        if: steps.snapshot.outputs.needs_deployment == 'true'
        env:
          ARTICLE_URL: ${{ steps.snapshot.outputs.article_url }}
        run: |
          {
            echo '## Article deployed'
            echo
            echo "The saved snapshot is live at ${ARTICLE_URL}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the existing snapshot
        if: steps.snapshot.outputs.needs_deployment != 'true'
        env:
          ARTICLE_URL: ${{ steps.snapshot.outputs.article_url }}
        run: |
          {
            echo '## Article already current'
            echo
            echo "No content changed. The existing article remains at ${ARTICLE_URL}."
          } >> "$GITHUB_STEP_SUMMARY"
